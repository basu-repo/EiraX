; Standalone UGV RTAB-Map viewer preferences.
[Core]
Rtabmap\WorkingDirectory=/tmp

[Gui]
# UGV viewing preset. This filters rendering only; SLAM and rosbag data retain
# the full point cloud.
General\colorSchemeScan0=3
General\colorSchemeScan1=3
General\downsamplingScan0=2
General\downsamplingScan1=2
General\opacityScan0=1
General\opacityScan1=1
General\ptSizeScan0=1
General\ptSizeScan1=1
General\showClouds0=false
General\showClouds1=false
General\showFeatures0=false
General\showFeatures1=false
General\showFrames=false
General\showFrustums0=false
General\showFrustums1=false
General\showGraphs=false
General\showLabels=false
General\showLandmarks=false
General\showScans0=true
General\showScans1=true
General\voxelSizeScan0=0.20
General\voxelSizeScan1=0.20
widget_cloudViewer\bg_color=@Variant(\0\0\0\x43\x1\xff\xff\0\0\0\0\0\0\0\0)
widget_cloudViewer\camera_axis_shown=true
widget_cloudViewer\camera_lockZ=true
widget_cloudViewer\camera_target_follow=true
widget_cloudViewer\color_range_inverted=0
widget_cloudViewer\color_range_max=0
widget_cloudViewer\color_range_min=0
widget_cloudViewer\coordinate_frame_scale=0.5
widget_cloudViewer\grid=false
widget_cloudViewer\intensity_max=100
widget_cloudViewer\intensity_rainbow_colormap=true
widget_cloudViewer\intensity_red_colormap=false
widget_cloudViewer\normals=false
widget_cloudViewer\rendering_rate=8
widget_cloudViewer\trajectory_shown=true
widget_cloudViewer\trajectory_size=2
