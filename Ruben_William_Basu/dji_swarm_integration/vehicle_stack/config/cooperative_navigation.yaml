version: 1

# Forward limit for the isolated cooperative mission. DWB may command any
# lower speed when turning, approaching a goal, or avoiding an obstacle.
forward_motion:
  maximum_speed_mps: 1.25
  acceleration_mps2: 1.25

# Physical safety bounds for combined-mode local planning. These are limits,
# not commanded manoeuvres. DWB selects forward, rotational, or reverse
# trajectories dynamically from the live local costmap.
reverse_motion:
  enabled: false
  maximum_speed_mps: 0.25
  velocity_samples: 30

# Explicit stuck recovery only. Normal DWB sampling remains forward-only.
reverse_recovery:
  enabled: true
  distance_m: 1.5
  speed_mps: 0.15
  time_allowance_sec: 15
  lidar_freshness_sec: 1.0
  lidar_wait_timeout_sec: 10.0
