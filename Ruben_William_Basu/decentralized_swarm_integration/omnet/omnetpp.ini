[General]
network = EiraXSwarmNetwork
sim-time-limit = 3600s
simtime-resolution = ns
realtimescheduler-scaling = 1
scheduler-class = "cRealTimeScheduler"
output-scalar-file = "results/${configname}-#${runnumber}.sca"
output-vector-file = "results/${configname}-#${runnumber}.vec"

# Three separately spawned PX4 x500_mapping vehicles.
*.numUavs = 3
*.enablePoseBridge = true
*.enableMetrics = true

# Headless-safe default; Qtenv users may override this explicitly.
*.visualizer.osgVisualizer.typename = ""

# ROS multi_pose_bridge -> OMNeT++ mobility.
*.gazeboScheduler.host = "127.0.0.1"
*.gazeboScheduler.port = 5555
*.gazeboScheduler.updateInterval = 0.05s
*.gazeboScheduler.connectAt = 0s
*.gazeboScheduler.recvTimeoutMs = 100

# Common coordinate mapping. Gazebo/ROS ENU Y is reflected into the OMNeT scene.
*.u*.mobility.typename = "GazeboDrivenMobility"
*.u*.mobility.schedulerModule = "^.^.gazeboScheduler"
*.u*.mobility.freezeAutonomousMotion = true
*.u*.mobility.faceForward = false
*.u*.mobility.alignFirstPoseToInitial = false
*.u*.mobility.ignoreZ = false
*.u*.mobility.offsetX = 50m
*.u*.mobility.offsetY = 50m
*.u*.mobility.offsetZ = 0m
*.u*.mobility.scaleX = 1
*.u*.mobility.scaleY = -1
*.u*.mobility.scaleZ = 1
*.u*.mobility.yawOffset = 0deg
*.u*.mobility.speed = 0mps
*.u*.mobility.margin = 0m
*.u*.mobility.speedStdDev = 0mps
*.u*.mobility.angleStdDev = 0deg
*.u*.mobility.alpha = 1
*.u*.mobility.constraintAreaMinX = -250m
*.u*.mobility.constraintAreaMinY = -450m
*.u*.mobility.constraintAreaMinZ = -5m
*.u*.mobility.constraintAreaMaxX = 750m
*.u*.mobility.constraintAreaMaxY = 550m
*.u*.mobility.constraintAreaMaxZ = 200m
*.ugv.mobility.initialX = 50m
*.ugv.mobility.initialY = 50m
*.ugv.mobility.initialZ = 0m
*.uav[0].mobility.initialX = 40m
*.uav[0].mobility.initialY = 45m
*.uav[0].mobility.initialZ = 10m
*.uav[1].mobility.initialX = 40m
*.uav[1].mobility.initialY = 48m
*.uav[1].mobility.initialZ = 10m
*.uav[2].mobility.initialX = 40m
*.uav[2].mobility.initialY = 51m
*.uav[2].mobility.initialZ = 10m
*.ugv.mobility.trackedModel = "ugv"
*.uav[0].mobility.trackedModel = "uav0"
*.uav[1].mobility.trackedModel = "uav1"
*.uav[2].mobility.trackedModel = "uav2"

# One UGV downlink flow per UAV. Metrics are observed at each UAV receiver,
# which keeps packet and PHY statistics attributable to an individual link.
*.ugv.numApps = 3
*.ugv.app[*].typename = "UdpBasicApp"
*.ugv.app[*].messageLength = 512B
*.ugv.app[*].sendInterval = 0.1s
*.ugv.app[*].startTime = 0.5s
*.ugv.app[*].stopTime = -0.1s
*.ugv.app[0].destAddresses = "uav[0]"
*.ugv.app[0].destPort = 5000
*.ugv.app[1].destAddresses = "uav[1]"
*.ugv.app[1].destPort = 5001
*.ugv.app[2].destAddresses = "uav[2]"
*.ugv.app[2].destPort = 5002
*.uav[*].numApps = 1
*.uav[*].app[0].typename = "UdpSink"
*.uav[0].app[0].localPort = 5000
*.uav[1].app[0].localPort = 5001
*.uav[2].app[0].localPort = 5002

# Current OmnetMetricsServer reads its radio relative to `ugvModule`; for each
# instance that parameter intentionally points at the receiving UAV. Distance
# is symmetric, and navigation never consumes this geometric value.
*.metricsServer[*].updateInterval = 0.1s
*.metricsServer[*].radioModulePath = "wlan[0].radio"
*.metricsServer[*].txPowerDbm = 13.0
*.metricsServer[*].carrierFreqHz = 2.4e9
*.metricsServer[*].noisePowerDbm = -90.0
*.metricsServer[*].usePathLossFallback = true
*.metricsServer[*].publishRadioDistanceEstimate = true
*.metricsServer[*].radioDistanceModel = "fspl"
*.metricsServer[0].port = 5556
*.metricsServer[0].ugvModule = "^.uav[0]"
*.metricsServer[0].uavModule = "^.ugv"
*.metricsServer[1].port = 5557
*.metricsServer[1].ugvModule = "^.uav[1]"
*.metricsServer[1].uavModule = "^.ugv"
*.metricsServer[2].port = 5558
*.metricsServer[2].ugvModule = "^.uav[2]"
*.metricsServer[2].uavModule = "^.ugv"

# Non-5G INET 802.11g baseline.
**.wlan[*].bitrate = 54Mbps
**.wlan[*].radio.transmitter.bitrate = 54Mbps
**.wlan[*].opMode = "g(mixed)"
**.wlan[*].radio.bandwidth = 20MHz
**.wlan[*].radio.transmitter.power = 20mW
**.wlan[*].radio.receiver.sensitivity = -85dBm
*.radioMedium.mediumLimitCache.carrierFrequency = 2.4GHz
*.radioMedium.pathLoss.typename = "FreeSpacePathLoss"

*.physicalEnvironment.config = xmldoc("ground.xml")
*.coordinateSystem.typename = "SimpleGeographicCoordinateSystem"
*.coordinateSystem.sceneMinX = -250m
*.coordinateSystem.sceneMinY = -450m
*.coordinateSystem.sceneMinZ = -5m
*.coordinateSystem.sceneMaxX = 750m
*.coordinateSystem.sceneMaxY = 550m
*.coordinateSystem.sceneMaxZ = 200m
*.coordinateSystem.sceneLatitude = 0deg
*.coordinateSystem.sceneLongitude = 0deg

**.scalar-recording = true
**.vector-recording = false
**.packetSentToUpper:vector.vector-recording = true
**.packetDropped:vector.vector-recording = true
